# Имя рабочего процесса, которое будет отображаться во вкладке "Actions" на GitHub.
name: Build and Push Docker Images

# Секция `on` определяет события (триггеры), которые запускают этот workflow.
on:
  # 1. Автоматический запуск при каждом push-событии в ветку 'main'.
  push:
    branches:
      - main
      #- 'review-*' # Добавлен триггер для веток, начинающихся с 'review-'

  # 2. Ручной запуск (workflow_dispatch) из интерфейса GitHub.
  # Позволяет запускать workflow для любой ветки по необходимости.
  workflow_dispatch:

# Определяем задачи (jobs), которые будут выполняться в рамках workflow.
jobs:
  # Единственная задача 'build-and-push' отвечает за сборку и публикацию образов.
  build-and-push:
    # Указываем, что задача будет выполняться на последней версии Ubuntu,
    # предоставляемой GitHub (т.н. "runner").
    runs-on: ubuntu-latest

    # Определяем права доступа для временного токена GITHUB_TOKEN.
    # `packages: write` необходимо для публикации образов в GitHub Container Registry.
    permissions:
      contents: read
      packages: write

    # Определяем последовательность шагов (steps), из которых состоит задача.
    steps:
      # Шаг 1: Клонирование репозитория.
      # Action `actions/checkout` скачивает код из указанной ветки на runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Шаг 2: Аутентификация в GitHub Container Registry (ghcr.io).
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Шаг 3: Настройка Docker Buildx.
      # Этот action инициализирует и настраивает современный сборщик Docker,
      # что является лучшей практикой и расширяет возможности сборки.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 4: Создание .env файла для фронтенда.
      # Этот шаг "впекает" production-URL API в статические файлы
      # фронтенда на этапе сборки.
      - name: Create frontend .env file
        run: |
          echo "VITE_API_URL=https://api.i-bocharov-project.nomorepartiessbs.ru/api/afisha" >> ./frontend/.env
          echo "VITE_CDN_URL=https://api.i-bocharov-project.nomorepartiessbs.ru/content/afisha" >> ./frontend/.env

      # Шаг 5: Сборка и публикация Docker-образа бэкенда.
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend # Путь к директории с Dockerfile.
          push: true # Публиковать образ после сборки.
          # Тег образа. `github.repository` - это `имя_пользователя/имя_репозитория`.
          tags: ghcr.io/${{ github.repository }}/film-api-backend:latest

      # Шаг 6: Сборка и публикация Docker-образа фронтенда.
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository }}/film-api-frontend:latest
